<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unicode Map preview</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        padding: 0.75rem 1rem;
        background: Canvas;
        border-bottom: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      }
      h1 {
        margin: 0 1rem 0 0;
        font-size: 1rem;
      }
      button[aria-current='true'] {
        font-weight: bold;
      }
      main {
        padding: 1rem;
      }
      #chart {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
      }
      #pdf {
        display: block;
        width: 100%;
        height: 85vh;
        border: 0;
      }
      /* The rules above would otherwise outweigh the browser's own [hidden]. */
      [hidden] {
        display: none !important;
      }
      #status,
      #message {
        padding: 1rem;
        border: 1px dashed color-mix(in srgb, CanvasText 40%, transparent);
        border-radius: 0.5rem;
        line-height: 1.6;
      }
      #downloads {
        margin: 0 0 1rem;
        padding-left: 1.25rem;
        line-height: 1.8;
      }
      #preview {
        margin: 0 0 1rem;
      }
      p.hint {
        margin: 0;
        color: color-mix(in srgb, CanvasText 60%, transparent);
        font-size: 0.85rem;
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 0.75rem;
        padding: 0.75rem 1rem;
        border-top: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        color: color-mix(in srgb, CanvasText 60%, transparent);
        font-size: 0.85rem;
      }
      footer > * + *::before {
        content: '/';
        margin-inline-end: 0.75rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Unicode Map</h1>
      <button type="button" data-chart="bmp-1">bmp-1</button>
      <button type="button" data-chart="bmp-2">bmp-2</button>
      <button type="button" data-chart="bmp-3">bmp-3</button>
      <p class="hint" id="dev-hint" hidden>
        Edits under <code>data/</code> or <code>src/</code> rebuild the posters and reload this
        page.
      </p>
      <p class="hint" id="release-hint" hidden></p>
    </header>
    <main>
      <p id="status" hidden>
        <code id="status-file"></code> has not been built yet. Run <code>vp run build</code> (or
        <code>vp run watch</code>) first; this page reloads by itself once the build succeeds.
      </p>
      <p id="message" hidden></p>
      <ul id="downloads" hidden></ul>
      <p id="preview" hidden><button type="button" id="load-preview"></button></p>
      <img id="chart" alt="Code point chart" hidden />
      <iframe id="pdf" title="Poster" hidden></iframe>
    </main>
    <footer>
      <span><a href="https://github.com/eggplants/unicode-map">eggplants/unicode-map</a></span>
      <span><a href="https://github.com/eggplants/unicode-map#-license">GPLv3 / MIT</a></span>
      <span><a id="release-link">Latest release</a></span>
      <span id="commit" hidden></span>
    </footer>
    <script type="module">
      const REPO = 'eggplants/unicode-map';
      const REPO_URL = `https://github.com/${REPO}`;
      const RELEASES = `${REPO_URL}/releases`;
      const CHARTS = ['bmp-1', 'bmp-2', 'bmp-3'];
      const FORMATS = ['svg', 'png', 'pdf'];

      // The dev server injects this flag. Anywhere else - GitHub Pages, above
      // all - there is no local build to show, so the latest release is used.
      const isDev = window.__unicodeMapDev === true;

      const requested = new URLSearchParams(location.search).get('chart');
      const name = CHARTS.includes(requested) ? requested : CHARTS[0];

      const devHint = document.getElementById('dev-hint');
      const releaseHint = document.getElementById('release-hint');
      const status = document.getElementById('status');
      const message = document.getElementById('message');
      const downloads = document.getElementById('downloads');
      const preview = document.getElementById('preview');
      const loadPreview = document.getElementById('load-preview');
      const chart = document.getElementById('chart');
      const pdf = document.getElementById('pdf');
      const releaseLink = document.getElementById('release-link');
      const commit = document.getElementById('commit');

      releaseLink.href = RELEASES;

      for (const button of document.querySelectorAll('[data-chart]')) {
        button.ariaCurrent = String(button.dataset.chart === name);
        button.addEventListener('click', () => {
          location.search = `?chart=${button.dataset.chart}`;
        });
      }

      const say = (...nodes) => {
        message.replaceChildren(...nodes);
        message.hidden = false;
      };

      const link = (href, text) => {
        const anchor = document.createElement('a');
        anchor.href = href;
        anchor.textContent = text;

        return anchor;
      };

      const formatSize = (bytes) => `${(bytes / 1e6).toFixed(1)} MB`;

      const formatDate = (date) => date.toLocaleDateString(undefined, { dateStyle: 'medium' });

      /**
       * Names the commit this page was built from. The workflow writes the file
       * when it deploys, and the dev server answers with the local HEAD.
       */
      const showCommit = async () => {
        try {
          const response = await fetch('commit.json');

          if (!response.ok) {
            return;
          }

          const { hash, date } = await response.json();

          if (typeof hash !== 'string' || typeof date !== 'string') {
            return;
          }

          commit.replaceChildren(link(`${REPO_URL}/tree/${hash}`, hash), ` (${date})`);
          commit.hidden = false;
        } catch {
          // Without it the footer simply leaves the commit out.
        }
      };

      // Release assets are served as attachments from another origin, so only
      // a PDF sitting next to this page can go into the browser's own viewer -
      // which pans and zooms far better than anything we could put on an image.
      const canUsePdf = navigator.pdfViewerEnabled === true;

      const exists = async (url) => {
        try {
          return (await fetch(url, { method: 'HEAD' })).ok;
        } catch {
          return false;
        }
      };

      const showPdf = (url) => {
        pdf.src = `${url}#view=Fit`;
        pdf.hidden = false;
        status.hidden = true;
        message.hidden = true;
      };

      /** Shows what the local build wrote into the project root. */
      const showLocalBuild = async () => {
        devHint.hidden = false;

        // Both are regenerated in place, so bust the cache on every load.
        const stamp = `?t=${Date.now()}`;
        const poster = `/${name}-poster.pdf${stamp}`;

        if (canUsePdf && (await exists(poster))) {
          showPdf(poster);

          return;
        }

        const file = `${name}-chart.svg`;

        document.getElementById('status-file').textContent = file;

        chart.addEventListener('load', () => {
          chart.hidden = false;
          status.hidden = true;
        });
        chart.addEventListener('error', () => {
          chart.hidden = true;
          status.hidden = false;
        });

        chart.src = `/${file}${stamp}`;
      };

      /** Lists the posters of the newest release, straight from the GitHub API. */
      const showLatestRelease = async () => {
        say('Looking up the latest release...');

        let release;

        try {
          const response = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`, {
            headers: { accept: 'application/vnd.github+json' },
          });

          if (!response.ok) {
            throw new Error(`GitHub answered with ${response.status}`);
          }

          release = await response.json();
        } catch (error) {
          say(
            `The latest release could not be looked up (${error.message}). `,
            link(RELEASES, 'Browse the releases on GitHub'),
            ' instead.',
          );

          return;
        }

        releaseLink.href = release.html_url;
        releaseLink.textContent = `Latest release (${release.tag_name})`;

        releaseHint.replaceChildren(
          link(release.html_url, release.tag_name),
          `, released on ${formatDate(new Date(release.published_at))}.`,
        );
        releaseHint.hidden = false;

        const assets = FORMATS.map((format) =>
          (release.assets ?? []).find((asset) => asset.name === `${name}-poster.${format}`),
        ).filter((asset) => asset !== undefined);

        if (assets.length === 0) {
          say(
            `${release.tag_name} carries no ${name} poster. `,
            link(RELEASES, 'Browse the releases on GitHub'),
            '.',
          );

          return;
        }

        downloads.replaceChildren(
          ...assets.map((asset) => {
            const item = document.createElement('li');
            item.append(
              link(asset.browser_download_url, `${asset.name} (${formatSize(asset.size)})`),
            );

            return item;
          }),
        );
        downloads.hidden = false;
        message.hidden = true;

        // The workflow bundles the release PDFs next to this page, so this one
        // is same-origin and the browser will open it in its own viewer.
        const poster = `${name}-poster.pdf`;

        if (canUsePdf && (await exists(poster))) {
          showPdf(poster);

          return;
        }

        const png = assets.find((asset) => asset.name.endsWith('.png'));

        if (png === undefined) {
          return;
        }

        chart.alt = `${name} poster`;
        chart.addEventListener('load', () => {
          chart.hidden = false;
          message.hidden = true;
        });
        chart.addEventListener('error', () => {
          say(
            'The poster could not be loaded. ',
            link(png.browser_download_url, 'Download it'),
            '.',
          );
        });

        // Posters are tens of megabytes, so nobody gets one without asking.
        loadPreview.textContent = `Show the poster (${formatSize(png.size)})`;
        preview.hidden = false;
        loadPreview.addEventListener(
          'click',
          () => {
            preview.hidden = true;
            say('Downloading the poster...');
            chart.src = png.browser_download_url;
          },
          { once: true },
        );
      };

      await showCommit();

      if (isDev) {
        await showLocalBuild();
      } else {
        await showLatestRelease();
      }
    </script>
  </body>
</html>
