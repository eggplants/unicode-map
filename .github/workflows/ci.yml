name: CI

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Sets up Vite+, Node.js and pnpm, and caches the package manager data.
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: '24'
          cache: true

      - run: vp install --frozen-lockfile

      - name: Format, lint and type check
        run: vp check

      - name: Test
        run: vp test

  build:
    name: Build posters
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          lfs: true
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: '24'
          cache: true

      - run: vp install --frozen-lockfile

      # Almost 1GB of font data, so keep it between runs.
      - name: Cache fonts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fonts
          key: fonts-${{ hashFiles('src/lib/download-fonts.ts') }}

      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Build
        run: vp run build
        env:
          DEBUG: 'true'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: posters
          path: |
            bmp-*-poster.svg
            bmp-*-poster.png
            bmp-*-poster.pdf
          if-no-files-found: error

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: posters

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            bmp-*-poster.svg
            bmp-*-poster.png
            bmp-*-poster.pdf
